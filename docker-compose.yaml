services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ALLOWED_API_KEYS=demo,changeme-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes: [./data:/app/data, ./models:/app/models]
    depends_on: [redis, kafka, mongo]
    deploy:
      replicas: 3
      resources:
        limits: {cpus: '1', memory: 2G}
        reservations: {cpus: '0.5', memory: 1G}

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment: {ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000}

  mongo:
    image: mongo:5
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # fixed filename
      - ./alerts.yml:/etc/prometheus/alerts.yml           # added missing file
      - prometheus_data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--web.enable-lifecycle']

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment: [GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    ports: ["5000:5000"]
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow --host 0.0.0.0
    volumes: [mlflow_data:/mlflow]

volumes:
  redis_data: {}
  mongo_data: {}
  prometheus_data: {}
  grafana_data: {}
  mlflow_data: {}
